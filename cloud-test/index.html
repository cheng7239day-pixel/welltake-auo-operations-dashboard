<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Welltake 雲端測試工作台</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf3f6;color:#203541;font:16px/1.6 system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:30px}header{margin-bottom:28px}h1{margin:8px 0}small,.muted{color:#516b7a}.pill{background:#d4e9ec;color:#155260;border-radius:20px;padding:5px 12px}.card{background:white;border:1px solid #d4e0e7;border-radius:14px;padding:24px;margin:18px 0}label{display:inline-block;margin:8px 12px 8px 0}input,select,button{font:inherit;padding:10px;border:1px solid #abc1ce;border-radius:7px}button{background:#17647c;color:white;cursor:pointer;margin:5px}button:disabled{opacity:.45;cursor:default}input{max-width:100%}table{border-collapse:collapse;width:100%}th,td{padding:10px;text-align:left;border-bottom:1px solid #d4e0e7}.scroll{overflow:auto}[hidden]{display:none!important}#message{white-space:pre-wrap}a{color:#17647c}.metrics{display:flex;flex-wrap:wrap;gap:14px}.metric{background:#edf3f6;padding:16px;border-radius:9px;min-width:170px}.metric strong{font-size:26px;display:block}</style></head><body><main>
<header><span class="pill">獨立雲端測試入口</span><h1>Welltake 雲端工作台</h1><p>驗證登入、管理者核准、廠區權限與跨裝置快照。僅使用系統產生的模擬案件。</p><a href="../">回到本機分析平台</a></header>
<section class="card" id="login"><h2>信箱驗證登入</h2><form id="loginForm"><label>電子郵件<br><input id="email" type="email" autocomplete="email" required maxlength="254"></label><button id="send">寄送登入連結</button></form><p class="muted">請在同一瀏覽器開啟信中的登入連結。首次登入後可申請權限，核准前無法讀取案件。驗證信寄送受測試環境郵件服務限制。</p></section>
<p id="message" role="status" aria-live="polite"></p>
<section id="account" class="card" hidden><h2>我的帳號</h2><p id="identity"></p><button id="refresh">重新讀取</button><button id="logout">登出</button><form id="requestForm" hidden><label>顯示名稱 <input id="name" maxlength="60" required></label><button>申請使用權限</button></form></section>
<section id="work" class="card" hidden><h2>模擬資料匯入與查看</h2><label>測試廠區 <select id="site"></select></label><label>資料日期 <select id="day"><option>2026-11-02</option><option>2026-11-03</option></select></label><button id="import">保存當日模擬快照</button><button id="load">查看選定日期</button><button id="compare">比較 11/02 → 11/03</button><p>同一日期及廠區重複保存會使用既有批次，不重複新增。讀取資料直接來自雲端，未存到本機案件快取。</p><p id="batch"></p><div class="metrics" id="metrics"></div><div class="scroll"><table id="cases"></table></div></section>
<section id="admin" class="card" hidden><h2>帳號審核</h2><p>只能指定小組長或檢視者；管理者帳號不在此頁升級。核准後，小組長可保存授權廠區的模擬快照，檢視者僅可讀取。</p><div id="members"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script>
'use strict';
const SUPABASE_URL='https://xaipuzdewphyznjysrla.supabase.co',KEY='sb_publishable_z6oDWrWKsuDQknVIk0Xkhg_i28WP4F0';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let client,member=null,viewer=null;
function message(t){$('message').textContent=t}
async function checked(p){const r=await p;if(r.error)throw r.error;return r.data}
function clearViews(){$('work').hidden=$('admin').hidden=true;$('cases').innerHTML=$('metrics').innerHTML=$('members').innerHTML='';$('batch').textContent='';member=null}
async function profile(){clearViews();viewer=(await checked(client.auth.getUser()))?.user;if(!viewer){$('login').hidden=false;$('account').hidden=true;return}$('login').hidden=true;$('account').hidden=false;member=await checked(client.from('dashboard_members').select('*').eq('user_id',viewer.id).maybeSingle());$('identity').textContent=viewer.email+'｜'+(member?member.display_name+'｜'+member.role+'｜'+member.approval_status:'尚未申請');$('requestForm').hidden=!!member;if(!member||member.approval_status!=='approved')return;$('work').hidden=false;const sites=member.role==='admin'?['TEST-HC','TEST-KA']:member.allowed_sites;$('site').replaceChildren(...sites.map(s=>{const o=document.createElement('option');o.value=o.textContent=s;return o}));$('import').hidden=!['admin','leader'].includes(member.role);if(member.role==='admin')await members()}
async function members(){$('admin').hidden=false;const rows=await checked(client.from('dashboard_members').select('*').order('created_at'));$('members').replaceChildren();for(const m of rows){const box=document.createElement('div');box.className='card';box.innerHTML=`<strong>${esc(m.display_name||'未命名')}</strong><p>${esc(m.user_id)}｜${esc(m.approval_status)}</p>`;if(m.role==='admin'){box.append(document.createTextNode('管理者（受保護）'));$('members').append(box);continue}const role=document.createElement('select');for(const [v,t] of [['leader','小組長'],['viewer','檢視者']]){const o=document.createElement('option');o.value=v;o.textContent=t;role.append(o)}role.value=m.role==='leader'?'leader':'viewer';box.append(role);const checks=['TEST-HC','TEST-KA'].map(site=>{const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=m.allowed_sites.includes(site);label.append(input,document.createTextNode(site));box.append(label);return {site,input}});for(const [status,title] of [['approved','核准／更新'],['disabled','停用']]){const button=document.createElement('button');button.textContent=title;button.onclick=()=>run(button,async()=>{const sites=checks.filter(x=>x.input.checked).map(x=>x.site);if(status==='approved'&&!sites.length)throw Error('請選擇至少一個測試廠區');if(!confirm(`${title}「${m.display_name}」：${role.value}，範圍 ${sites.join('、')||'無'}？`))return;await checked(client.rpc('review_dashboard_member',{p_user:m.user_id,p_role:role.value,p_status:status,p_sites:sites}));await members();message('帳號設定已更新')});box.append(button)}$('members').append(box)}}
async function batch(day,site){return await checked(client.from('import_batches').select('id,snapshot_date,row_count,created_at').eq('snapshot_date',day).eq('test_site',site).eq('scope_version','cloud-demo-v1').eq('status','complete').maybeSingle())}
async function rowsFor(b){return b?await checked(client.from('case_snapshots').select('case_id,site,owner_account,case_type,status,started_at,handled_at').eq('batch_id',b.id)):[]}
async function loadDay(){const b=await batch($('day').value,$('site').value);$('metrics').innerHTML='';$('cases').innerHTML='';$('batch').textContent=b?`${b.snapshot_date}｜${b.row_count} 件｜雲端保存 ${new Date(b.created_at).toLocaleString('zh-TW')}`:'此日期尚無可讀取快照。';const rows=await rowsFor(b);if(!b)return;$('cases').innerHTML='<thead><tr><th>案件</th><th>承辦人</th><th>類型</th><th>狀態</th></tr></thead><tbody>'+rows.map(r=>'<tr>'+[r.case_id,r.owner_account,r.case_type,r.status].map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody>'}
function summarize(a,b){const prior=new Map(a.map(r=>[r.case_id,r]));const done=b.filter(r=>prior.get(r.case_id)?.status==='In Progress'&&['Resolved','Closed'].includes(r.status)&&r.handled_at&&new Date(r.handled_at)>=new Date('2026-11-03T00:00:00+08:00')&&new Date(r.handled_at)<new Date('2026-11-04T00:00:00+08:00'));const dayDiff=r=>Math.floor((Date.parse('2026-11-02T00:00:00+08:00')-Date.parse(r.started_at))/86400000);return {start:a.filter(r=>r.status==='In Progress').length,end:b.filter(r=>r.status==='In Progress').length,done:done.length,old:done.filter(r=>dayDiff(prior.get(r.case_id))>21).length}}
async function compare(){const site=$('site').value;const [a,b]=await Promise.all([batch('2026-11-02',site),batch('2026-11-03',site)]);if(!a||!b)throw Error('請先保存此廠區的兩個日期');const x=summarize(await rowsFor(a),await rowsFor(b));$('metrics').innerHTML=[['期初未完成',x.start],['期末未完成',x.end],['區間完成',x.done],['完成老案',x.old]].map(([k,v])=>`<div class="metric">${k}<strong>${v}</strong></div>`).join('');$('batch').textContent=site+'｜2026-11-02 → 2026-11-03｜模擬資料';$('cases').innerHTML=''}
async function run(button,action){button.disabled=true;message('處理中…');try{await action()}catch(e){message('未完成：'+(e.message||String(e)))}finally{button.disabled=false}}
$('loginForm').onsubmit=e=>{e.preventDefault();run($('send'),async()=>{await checked(client.auth.signInWithOtp({email:$('email').value.trim(),options:{emailRedirectTo:location.origin+location.pathname}}));message('若信箱可使用，登入連結已寄出。請查看信箱；勿將連結轉寄他人。')})};
$('requestForm').onsubmit=e=>{e.preventDefault();run(e.submitter,async()=>{await checked(client.rpc('request_dashboard_access',{p_name:$('name').value.trim()}));await profile();message('申請已送出，等待管理者核准')})};
$('refresh').onclick=()=>run($('refresh'),async()=>{await profile();message('已重新讀取帳號狀態')});
$('logout').onclick=()=>run($('logout'),async()=>{await checked(client.auth.signOut());clearViews();$('account').hidden=true;$('login').hidden=false;viewer=null;message('已登出')});
$('import').onclick=()=>run($('import'),async()=>{await checked(client.rpc('save_demo_snapshot',{p_day:$('day').value,p_site:$('site').value}));await loadDay();message('模擬快照已保存，可於其他裝置登入查看')});
$('load').onclick=()=>run($('load'),async()=>{await loadDay();message('雲端讀取完成')});$('compare').onclick=()=>run($('compare'),async()=>{await compare();message('比較完成')});
$('site').onchange=$('day').onchange=()=>{$('cases').innerHTML=$('metrics').innerHTML='';$('batch').textContent='請按查看選定日期';};
(async()=>{try{if(!window.supabase)throw Error('登入元件無法載入，請確認網路允許 jsDelivr');client=supabase.createClient(SUPABASE_URL,KEY,{auth:{storageKey:'welltake-cloud-test-auth',persistSession:true,detectSessionInUrl:true}});const {data,error}=await client.auth.getSession();if(error)throw error;if(data.session)await profile();message('雲端測試入口。需先完成後端權限啟用及管理者信箱驗證。');client.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){clearViews();$('account').hidden=true;$('login').hidden=false}})}catch(e){message(e.message)}})();
</script></body></html>
